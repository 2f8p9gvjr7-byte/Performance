<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Éval & Bonus"/>
  <meta name="theme-color" content="#0F1117"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Évaluation & Bonus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F1117; --surface: #1A1D27; --card: #22263A; --border: #2E3350;
      --accent: #6C63FF; --green: #34D399; --amber: #FBBF24;
      --red: #F87171; --text: #E8EAFF; --muted: #8B90BB; --faint: #4A4F72;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'Inter', sans-serif; }
    body { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
    input::-webkit-inner-spin-button { opacity: 1; }

    /* SETUP SCREEN */
    #setup-screen {
      display: flex; flex-direction: column; flex: 1; overflow-y: auto;
      background: var(--bg); padding: 0 0 40px;
    }
    #setup-screen.hidden { display: none; }
    .setup-hero {
      background: linear-gradient(160deg, #1A1D27 0%, #0F1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 40px 20px 28px; text-align: center;
    }
    .setup-hero .icon { font-size: 48px; margin-bottom: 12px; }
    .setup-hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .setup-hero p { color: var(--muted); font-size: 14px; margin-top: 6px; }

    .setup-section { padding: 20px 16px 0; }
    .setup-section h2 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .setup-item {
      display: flex; align-items: center; gap: 10;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .setup-item input[type=text] {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 15px; font-weight: 600; outline: none;
    }
    .setup-item input[type=text]::placeholder { color: var(--faint); font-weight: 400; }
    .setup-item .w-input {
      width: 52px; min-width: 52px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 700;
      text-align: center; padding: 6px 4px; outline: none;
    }
    .setup-item .pct { color: var(--faint); font-size: 13px; min-width: 14px; }
    .del-btn { background: none; border: none; color: var(--faint); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }

    .add-btn {
      width: 100%; padding: 12px; border: 1.5px dashed var(--border); border-radius: 12px;
      background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 2px; transition: all .2s;
    }
    .add-btn:active { background: var(--surface); }

    .weight-bar-wrap { height: 4px; background: var(--border); border-radius: 4px; margin: 4px 0 0; overflow: hidden; }
    .weight-bar-fill { height: 100%; border-radius: 4px; transition: width .3s, background .3s; }

    .weight-status {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 10px; margin-top: 10px;
      font-size: 13px; font-weight: 600;
    }

    .start-btn {
      margin: 24px 16px 0; padding: 16px; border-radius: 14px; border: none;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 800;
      cursor: pointer; width: calc(100% - 32px); letter-spacing: 0.3px;
      transition: opacity .2s;
    }
    .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* APP SCREEN */
    #app-screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    #app-screen.visible { display: flex; }

    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10; flex-shrink: 0;
    }
    .header-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .header-title { font-weight: 800; font-size: 15px; }
    .header-sub { color: var(--muted); font-size: 11px; }
    .reset-btn { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab { flex: 1; padding: 11px 4px; font-size: 12px; font-weight: 600; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .content { flex: 1; overflow-y: auto; padding: 14px 16px 20px; }

    section { display: none; flex-direction: column; gap: 12px; }
    section.active { display: flex; }

    /* Eval cards */
    .eval-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .eval-header { background: var(--surface); padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
    .eval-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12; }
    .crit-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
    .crit-name { font-size: 13px; font-weight: 600; }
    .crit-wt { color: var(--faint); font-size: 11px; }
    .bar-wrap { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }
    input.score-input {
      width: 52px; min-width: 52px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 700;
      text-align: center; padding: 6px 4px; outline: none;
    }
    .slash { color: var(--faint); font-size: 12px; }

    /* Results */
    .result-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; display: flex; align-items: center; gap: 12; flex-wrap: wrap;
    }
    .medal { font-size: 20px; min-width: 24px; text-align: center; }
    .result-name { font-weight: 700; font-size: 14px; }
    .result-bar { margin-top: 5px; }
    .score-col { text-align: center; }
    .score-val { font-size: 20px; font-weight: 800; }
    .score-den { color: var(--faint); font-size: 11px; }
    .share-col { text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; }
    .bonus-box { background: #34D39918; border: 1px solid #34D39944; border-radius: 10px; padding: 8px 14px; text-align: center; }
    .bonus-val { color: var(--green); font-weight: 800; font-size: 17px; }
    .bonus-lbl { color: var(--faint); font-size: 11px; }

    .envelope-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12; flex-wrap: wrap; }
    .envelope-card input { width: 130px; min-width: 130px; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; color: var(--text); font-size: 20px; font-weight: 800; text-align: right; padding: 8px 10px; outline: none; }
    .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
    .summary-box strong { color: var(--text); }

    .badge { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     SETUP SCREEN
═══════════════════════════════════════════════════ -->
<div id="setup-screen">
  <div class="setup-hero">
    <div class="icon">⭐</div>
    <h1>Évaluation & Bonus</h1>
    <p>Configurez vos critères et vos collaborateurs</p>
  </div>

  <!-- Critères -->
  <div class="setup-section">
    <h2>Critères d'évaluation</h2>
    <div id="setup-crit-list"></div>
    <button class="add-btn" onclick="addSetupCrit()">+ Ajouter un critère</button>
    <div id="weight-status" class="weight-status"></div>
  </div>

  <!-- Collaborateurs -->
  <div class="setup-section" style="margin-top:10px">
    <h2>Collaborateurs</h2>
    <div id="setup-collab-list"></div>
    <button class="add-btn" onclick="addSetupCollab()">+ Ajouter un collaborateur</button>
  </div>

  <button class="start-btn" id="start-btn" onclick="startApp()" disabled>
    Démarrer les évaluations →
  </button>
</div>

<!-- ═══════════════════════════════════════════════════
     APP SCREEN
═══════════════════════════════════════════════════ -->
<div id="app-screen">
  <div class="header">
    <div class="header-icon">⭐</div>
    <div>
      <div class="header-title">Évaluation & Bonus</div>
      <div class="header-sub" id="app-sub"></div>
    </div>
    <button class="reset-btn" onclick="resetApp()">⚙ Reconfigurer</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab(0)">① Évaluations</button>
    <button class="tab" onclick="showTab(1)">② Résultats & Bonus</button>
  </div>
  <div class="content">
    <section class="active" id="tab0">
      <p style="color:var(--muted); font-size:13px">Notez chaque collaborateur de 0 à 10 sur chaque critère.</p>
      <div id="eval-list" style="display:flex; flex-direction:column; gap:12px"></div>
    </section>
    <section id="tab1">
      <div class="envelope-card">
        <div style="flex:1">
          <div style="font-weight:700; font-size:15px">Enveloppe bonus</div>
          <div style="color:var(--muted); font-size:12px; margin-top:3px">Distribué proportionnellement aux notes</div>
        </div>
        <input type="number" id="envelope" value="10000" min="0" onchange="renderResults()"/>
        <span style="color:var(--muted); font-weight:700">€</span>
      </div>
      <div id="results-list" style="display:flex; flex-direction:column; gap:10px"></div>
      <div class="summary-box" id="summary"></div>
    </section>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────
let setupCriteria = [];   // { id, name, weight }
let setupCollabs  = [];   // { id, name }
let criteria = [];
let collabs  = [];
let scores   = {};

function uid() { return '_' + Math.random().toString(36).slice(2,8); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return Math.round(n).toLocaleString('fr-FR'); }

// ── Grade helpers ────────────────────────────────────────────────────
function gradeColor(s) {
  if (s >= 9)   return '#34D399';
  if (s >= 7.5) return '#8B85FF';
  if (s >= 6)   return '#FBBF24';
  if (s >= 4)   return '#FB923C';
  return '#F87171';
}
function gradeLabel(s) {
  if (s >= 9)   return 'Exceptionnel';
  if (s >= 7.5) return 'Excellent';
  if (s >= 6)   return 'Bien';
  if (s >= 4)   return 'Satisfaisant';
  return 'À améliorer';
}
function barColor(v) { return v >= 7.5 ? '#34D399' : v >= 5 ? '#6C63FF' : '#F87171'; }

function getScore(pid, cid) { return scores[pid+'_'+cid] ?? 5; }
function weightedScore(pid) {
  return criteria.reduce((s, c) => s + getScore(pid, c.id) * (c.weight / 100), 0);
}

// ═══════════════════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════════════════
function addSetupCrit(name='', weight=20) {
  setupCriteria.push({ id: uid(), name, weight });
  renderSetup();
}
function removeSetupCrit(id) {
  setupCriteria = setupCriteria.filter(c => c.id !== id);
  renderSetup();
}
function addSetupCollab(name='') {
  setupCollabs.push({ id: uid(), name });
  renderSetup();
}
function removeSetupCollab(id) {
  setupCollabs = setupCollabs.filter(c => c.id !== id);
  renderSetup();
}

function renderSetup() {
  // Criteria
  const cl = document.getElementById('setup-crit-list');
  cl.innerHTML = '';
  setupCriteria.forEach(c => {
    const d = document.createElement('div');
    d.className = 'setup-item';
    d.innerHTML = `
      <input type="text" placeholder="Nom du critère" value="${esc(c.name)}"
        oninput="setupCriteria.find(x=>x.id==='${c.id}').name=this.value; updateWeightStatus()"/>
      <input type="number" class="w-input" min="0" max="100" value="${c.weight}"
        oninput="setupCriteria.find(x=>x.id==='${c.id}').weight=Math.max(0,Math.min(100,+this.value||0)); updateWeightStatus()"/>
      <span class="pct">%</span>
      <button class="del-btn" onclick="removeSetupCrit('${c.id}')">✕</button>`;
    cl.appendChild(d);
  });

  // Collabs
  const pl = document.getElementById('setup-collab-list');
  pl.innerHTML = '';
  setupCollabs.forEach(p => {
    const d = document.createElement('div');
    d.className = 'setup-item';
    d.innerHTML = `
      <input type="text" placeholder="Prénom Nom" value="${esc(p.name)}"
        oninput="setupCollabs.find(x=>x.id==='${p.id}').name=this.value; updateStartBtn()"/>
      <button class="del-btn" onclick="removeSetupCollab('${p.id}')">✕</button>`;
    pl.appendChild(d);
  });

  updateWeightStatus();
  updateStartBtn();
}

function updateWeightStatus() {
  const total = setupCriteria.reduce((s,c) => s + (c.weight||0), 0);
  const ok = total === 100;
  const ws = document.getElementById('weight-status');
  ws.style.background = ok ? '#34D39918' : '#F8711718';
  ws.style.color = ok ? '#34D399' : '#F87171';
  ws.style.border = `1px solid ${ok ? '#34D39944' : '#F8717144'}`;
  ws.innerHTML = `<span>Total des pondérations</span><strong>${total} / 100 %</strong>`;
  updateStartBtn();
}

function updateStartBtn() {
  const total = setupCriteria.reduce((s,c) => s + (c.weight||0), 0);
  const critOk = total === 100 && setupCriteria.length > 0 && setupCriteria.every(c => c.name.trim());
  const collabOk = setupCollabs.length > 0 && setupCollabs.every(p => p.name.trim());
  document.getElementById('start-btn').disabled = !(critOk && collabOk);
}

function startApp() {
  criteria = setupCriteria.map(c => ({ ...c }));
  collabs  = setupCollabs.map(p => ({ ...p }));
  scores   = {};
  document.getElementById('setup-screen').classList.add('hidden');
  const app = document.getElementById('app-screen');
  app.classList.add('visible');
  document.getElementById('app-sub').textContent = `${collabs.length} collaborateurs · ${criteria.length} critères`;
  showTab(0);
  renderEvals();
}

function resetApp() {
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.remove('visible');
}

// ═══════════════════════════════════════════════════════════════════════
// APP TABS
// ═══════════════════════════════════════════════════════════════════════
function showTab(i) {
  document.querySelectorAll('#app-screen section').forEach((s,j) => s.classList.toggle('active', i===j));
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', i===j));
  if (i === 1) renderResults();
}

// ── Evaluations ────────────────────────────────────────────────────────
function renderEvals() {
  const list = document.getElementById('eval-list');
  list.innerHTML = '';
  collabs.forEach(p => {
    const total = weightedScore(p.id);
    const col = gradeColor(total);
    const card = document.createElement('div');
    card.className = 'eval-card';
    const rows = criteria.map(c => {
      const v = getScore(p.id, c.id);
      return `
        <div style="margin-bottom:10px">
          <div style="display:flex; align-items:center; gap:8px">
            <div style="flex:1">
              <div class="crit-name">${esc(c.name)}</div>
              <div class="crit-wt">Poids : ${c.weight}%</div>
            </div>
            <input type="number" class="score-input" min="0" max="10" step="0.5" value="${v}"
              onchange="setScoreUI('${p.id}','${c.id}',this.value,'score-total-${p.id}','grade-${p.id}')"/>
            <span class="slash">/10</span>
          </div>
          <div class="bar-wrap"><div class="bar-fill" id="bar-${p.id}-${c.id}" style="width:${v*10}%; background:${barColor(v)}"></div></div>
        </div>`;
    }).join('');
    card.innerHTML = `
      <div class="eval-header">
        <div class="avatar" style="background:${col}33; border:2px solid ${col}55; color:${col}">${p.name.charAt(0).toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-weight:700; font-size:15px">${esc(p.name)}</div>
          <div style="color:var(--muted); font-size:12px; margin-top:2px">
            Note pondérée : <strong id="score-total-${p.id}" style="color:${col}">${total.toFixed(2)}</strong>/10
          </div>
        </div>
        <span class="badge" id="grade-${p.id}" style="background:${col}22; color:${col}; border:1px solid ${col}44">${gradeLabel(total)}</span>
      </div>
      <div style="padding:12px 14px">${rows}</div>`;
    list.appendChild(card);
  });
}

function setScoreUI(pid, cid, val, totalId, gradeId) {
  const v = Math.min(10, Math.max(0, parseFloat(val)||0));
  scores[pid+'_'+cid] = v;
  const bar = document.getElementById('bar-'+pid+'-'+cid);
  if (bar) { bar.style.width = (v*10)+'%'; bar.style.background = barColor(v); }
  const total = weightedScore(pid);
  const col = gradeColor(total);
  const te = document.getElementById(totalId);
  const ge = document.getElementById(gradeId);
  if (te) { te.textContent = total.toFixed(2); te.style.color = col; }
  if (ge) { ge.textContent = gradeLabel(total); ge.style.color = col; ge.style.background = col+'22'; ge.style.borderColor = col+'44'; }
}

// ── Results ────────────────────────────────────────────────────────────
function renderResults() {
  const envelope = parseFloat(document.getElementById('envelope').value)||0;
  const results = collabs.map(p => ({ ...p, score: weightedScore(p.id) }));
  const totalScore = results.reduce((s,r) => s+r.score, 0);
  const sorted = [...results].sort((a,b) => b.score-a.score);
  const medals = ['🥇','🥈','🥉'];

  const list = document.getElementById('results-list');
  list.innerHTML = '';
  sorted.forEach((r,i) => {
    const col = gradeColor(r.score);
    const share = totalScore>0 ? (r.score/totalScore)*100 : 0;
    const bonus = totalScore>0 ? (r.score/totalScore)*envelope : 0;
    const d = document.createElement('div');
    d.className = 'result-item';
    if (i===0) { d.style.background='linear-gradient(120deg,var(--card) 55%,#6C63FF18)'; d.style.borderColor='#6C63FF55'; }
    d.innerHTML = `
      <div class="medal">${medals[i]||'#'+(i+1)}</div>
      <div class="avatar" style="background:${col}33; border:2px solid ${col}55; color:${col}">${r.name.charAt(0).toUpperCase()}</div>
      <div style="flex:1; min-width:80px">
        <div class="result-name">${esc(r.name)}</div>
        <div class="bar-wrap result-bar"><div class="bar-fill" style="width:${r.score*10}%; background:${col}"></div></div>
      </div>
      <div class="score-col">
        <div class="score-val" style="color:${col}">${r.score.toFixed(2)}</div>
        <div class="score-den">/10</div>
      </div>
      <div class="share-col">${share.toFixed(1)}%</div>
      <div class="bonus-box">
        <div class="bonus-val">${fmt(bonus)} €</div>
        <div class="bonus-lbl">bonus</div>
      </div>`;
    list.appendChild(d);
  });

  const avg = collabs.length>0 ? envelope/collabs.length : 0;
  const minB = sorted.length>0 && totalScore>0 ? (sorted[sorted.length-1].score/totalScore)*envelope : 0;
  const maxB = sorted.length>0 && totalScore>0 ? (sorted[0].score/totalScore)*envelope : 0;
  document.getElementById('summary').innerHTML = `
    <div>Total distribué : <strong>${fmt(envelope)} €</strong> sur ${collabs.length} collaborateurs</div>
    <div>Bonus moyen : <strong>${fmt(avg)} €</strong></div>
    <div>Fourchette : <strong>${fmt(minB)} € – ${fmt(maxB)} €</strong></div>`;
}

// ── Init ─────────────────────────────────────────────────────────────
// Pré-remplir avec quelques lignes vides pour guider l'utilisateur
addSetupCrit('', 25);
addSetupCrit('', 25);
addSetupCrit('', 25);
addSetupCrit('', 25);
addSetupCollab('');
addSetupCollab('');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
